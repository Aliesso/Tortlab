<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tortlab — Öz tortunu yarat</title>
  <meta name="description" content="Tortunuzu özünüz yaradın: forma, dad, krem, dekor və yazı. Sifarişi WhatsApp və ya email ilə göndərin.">
  <meta name="theme-color" content="#FAF5EF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Great+Vibes&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Tortlab ana səhifə">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="currentColor"/><path d="M8 19h16v5H8zM9 14.5c0-1.4 1.1-2.5 2.5-2.5h9c1.4 0 2.5 1.1 2.5 2.5V19H9z" fill="#fff"/><path d="M16 6.5c1.2 1.3 1.2 2.6 0 3.6-1.2-1-1.2-2.3 0-3.6z" fill="#FFD27A"/></svg>
      </span>
      <span class="brand-name">Tortlab</span>
    </a>
    <nav class="stepper" id="stepper" aria-label="Addımlar"></nav>
    <div class="top-meta">
      <span class="mobile-step" id="mobileStep"></span>
      <span class="price-pill" id="topPrice">0 ₼</span>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <main class="layout">
    <aside class="preview" aria-label="Tortun önizləməsi">
      <div class="preview-card">
        <div class="stage">
          <svg id="cakeSvg" viewBox="0 0 400 400" role="img" aria-label="Tortun yuxarıdan görünüşü"></svg>
        </div>
        <div class="slice">
          <svg id="sliceSvg" viewBox="0 0 300 140" role="img" aria-label="Tortun kəsik görünüşü"></svg>
          <span class="slice-label">Kəsik görünüşü</span>
        </div>
        <ul class="spec" id="specList"></ul>
        <div class="preview-price">
          <span>Təxmini qiymət</span>
          <strong id="price">0 ₼</strong>
        </div>
      </div>
    </aside>

    <section class="builder">
      <div id="stepContent" class="step-content"></div>
      <div class="nav-bar">
        <button type="button" class="btn btn-ghost" id="backBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          Geri
        </button>
        <div class="nav-price"><span>Cəmi</span><strong id="barPrice">0 ₼</strong></div>
        <button type="button" class="btn btn-primary" id="nextBtn">
          <span id="nextLabel">Növbəti</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
